services:
  # ─── Log collector: mounts docker.sock, tails every hafele container to
  #     a dedicated file under ./logs/. Truncates every file on its own start,
  #     which happens on every `docker compose up --build`. ───────────────
  log-collector:
    image: docker:cli
    container_name: hafele-log-collector
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /logs
        # Reset all container log files on every collector startup
        rm -f /logs/*.log
        echo "log-collector: cleared /logs/*.log at $$(date -u +%FT%TZ)"
        # Track which container we're already following
        TRACK=/tmp/tailing.list
        : > "$$TRACK"
        # Match every container spawned by this compose project.
        MATCH='^hafele-|^updatedwebscrapingproject-'
        while true; do
          for c in $$(docker ps --format '{{.Names}}' 2>/dev/null | grep -E "$$MATCH" || true); do
            # skip self
            [ "$$c" = "hafele-log-collector" ] && continue
            if ! grep -Fxq "$$c" "$$TRACK" 2>/dev/null; then
              echo "$$c" >> "$$TRACK"
              echo "log-collector: following $$c -> /logs/$$c.log"
              # Truncate the log file, then follow. When the container exits
              # (or is removed), drop it from the track list so a restart
              # is re-followed with a fresh log file.
              ( : > "/logs/$$c.log"
                docker logs -f "$$c" >> "/logs/$$c.log" 2>&1 || true
                sed -i "/^$$c$$/d" "$$TRACK"
                echo "log-collector: $$c stream ended" >> "/logs/$$c.log"
              ) &
            fi
          done
          sleep 3
        done

  # ─── Queue watchdog: if processors exit while `hafele:api_urls` still has
  #     work, restart the exited processor containers so they resume draining.
  #     When the queue is empty and every processor has exited cleanly, it
  #     also promotes the reporter from `Created` to running (a workaround
  #     for `docker compose up -d` not honouring `service_completed_successfully`
  #     after the initial start). ───────────────────────────────────────────
  queue-watchdog:
    image: docker:cli
    container_name: hafele-queue-watchdog
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_QUEUE_KEY=hafele:api_urls
      - DB_WRITE_QUEUE_KEY=hafele:db_write_queue
      - POLL_INTERVAL=30
      - RESTART_COOLDOWN=60
      - REPORTER_DRAIN_CONFIRM=3
    command:
      - sh
      - -c
      - |
        set -u
        Q="$${REDIS_QUEUE_KEY:-hafele:api_urls}"
        DBQ="$${DB_WRITE_QUEUE_KEY:-hafele:db_write_queue}"
        INTERVAL="$${POLL_INTERVAL:-30}"
        COOLDOWN="$${RESTART_COOLDOWN:-60}"
        CONFIRM_TICKS="$${REPORTER_DRAIN_CONFIRM:-3}"
        LAST_RESTART=0
        DRAIN_STREAK=0
        REPORTER_STARTED=0
        echo "watchdog: watching '$$Q' + '$$DBQ' every $${INTERVAL}s (cooldown $${COOLDOWN}s; reporter needs $${CONFIRM_TICKS} consecutive drain ticks)"
        while true; do
          sleep "$$INTERVAL"
          NOW=$$(date +%s)
          # Wait for harvester to finish before intervening
          HSTATUS=$$(docker exec hafele-redis redis-cli GET hafele:harvester:status 2>/dev/null || true)
          if [ "$$HSTATUS" != "done" ]; then
            DRAIN_STREAK=0
            continue
          fi
          QLEN=$$(docker exec hafele-redis redis-cli LLEN "$$Q" 2>/dev/null || echo 0)
          DBQLEN=$$(docker exec hafele-redis redis-cli LLEN "$$DBQ" 2>/dev/null || echo 0)
          RUNNING=$$(docker ps --filter 'name=updatedwebscrapingproject-processor-' --format '{{.Names}}' | wc -l | tr -d ' ')
          EXITED=$$(docker ps -a --filter 'name=updatedwebscrapingproject-processor-' --filter 'status=exited' --format '{{.Names}}')

          # Any sign of remaining work resets the drain streak so a
          # temporary queue dip (or a false idle-exit before variant API
          # URLs get re-enqueued) never fires the reporter. This also
          # guards against starting the reporter while db-writer still has
          # a backlog of scraped items it hasn't persisted yet.
          if [ "$$QLEN" != "0" ] || [ "$$DBQLEN" != "0" ] || [ "$$RUNNING" != "0" ]; then
            DRAIN_STREAK=0
          fi

          # Case 1: queue has work but no processors are running -> restart exited ones
          if [ "$$QLEN" -gt 0 ] && [ "$$RUNNING" -eq 0 ] && [ -n "$$EXITED" ]; then
            if [ $$(( NOW - LAST_RESTART )) -ge "$$COOLDOWN" ]; then
              COUNT=$$(echo "$$EXITED" | grep -c . || true)
              echo "watchdog: queue=$$QLEN running=0 exited=$$COUNT -> restarting"
              for c in $$EXITED; do
                docker start "$$c" >/dev/null 2>&1 && echo "watchdog:   restarted $$c"
              done
              LAST_RESTART=$$NOW
            else
              echo "watchdog: queue=$$QLEN but in cooldown ($$(( COOLDOWN - (NOW - LAST_RESTART) ))s left)"
            fi
            continue
          fi

          # Case 2: url queue + db-write queue both drained, no processors
          # alive -> confirm drain across CONFIRM_TICKS polls then start
          # the reporter. Re-run it if it exited early (previous premature
          # compose start with the defensive drain check returning exit 1
          # leaves it in 'exited').
          if [ "$$QLEN" = "0" ] && [ "$$DBQLEN" = "0" ] && [ "$$RUNNING" -eq 0 ]; then
            DRAIN_STREAK=$$(( DRAIN_STREAK + 1 ))
            echo "watchdog: drain observation $$DRAIN_STREAK/$$CONFIRM_TICKS (queue=0, db_write_queue=0, processors=0)"
            if [ "$$DRAIN_STREAK" -lt "$$CONFIRM_TICKS" ] || [ "$$REPORTER_STARTED" -ne 0 ]; then
              continue
            fi
            REPORTER_STATE=$$(docker inspect hafele-reporter --format '{{.State.Status}}' 2>/dev/null || echo missing)
            case "$$REPORTER_STATE" in
              created|exited)
                echo "watchdog: drain confirmed for $$CONFIRM_TICKS ticks, starting hafele-reporter (was $$REPORTER_STATE)"
                docker start hafele-reporter >/dev/null 2>&1 || true
                REPORTER_STARTED=1
                ;;
              *)
                echo "watchdog: hafele-reporter in state '$$REPORTER_STATE'; leaving it alone"
                REPORTER_STARTED=1
                ;;
            esac
          fi
        done

  redis:
    image: redis:7-alpine
    container_name: hafele-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Producer: discovers SKUs and pushes API URLs to Redis ───
  harvester:
    build:
      context: .
      dockerfile: Dockerfile.harvester
    container_name: hafele-harvester
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://hafele-redis:6379
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    command: ["python", "-m", "spiders.hafele_harvester"]

  # ─── Cookie refresher: every 10 min, re-logs in and updates the session
  #     cookies in Redis. Processors pick them up automatically through
  #     RedisCookieMiddleware (60s in-process cache) — no restart needed. ─
  cookie-refresher:
    build:
      context: .
      dockerfile: Dockerfile.harvester
    container_name: hafele-cookie-refresher
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      harvester:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://hafele-redis:6379
      - COOKIE_REFRESH_INTERVAL=600
    command: ["python", "-m", "refresh_cookies"]

  # ─── Consumers: 10 replicas that pop from Redis and process. No longer
  #     mount ./data -- they push scraped items to Redis instead of
  #     writing SQLite directly (see db-writer below). ──────────────────
  processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    deploy:
      replicas: 10
    depends_on:
      redis:
        condition: service_healthy
      harvester:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://hafele-redis:6379
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "scrapy", "crawl", "hafele_processor", "-s", "REDIS_URL=redis://hafele-redis:6379", "-s", "LOG_LEVEL=INFO"]

  # ─── Single dedicated SQLite writer. Ten processor containers writing to
  #     the same products.db file concurrently (over the virtiofs-backed
  #     ./data bind mount) silently lost most writes under load -- SQLite's
  #     WAL mode needs shared-memory lock coordination between writers that
  #     doesn't reliably work across separate container mount namespaces
  #     here. One process draining a Redis queue and writing serially
  #     removes the concurrent-writer scenario entirely. ─────────────────
  db-writer:
    build:
      context: .
      dockerfile: Dockerfile.processor
    container_name: hafele-db-writer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://hafele-redis:6379
      - DB_PATH=/app/data/products.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "db_writer"]

  # ─── Reporter: generates Excel & sends the completion email.
  #     No depends_on: the queue-watchdog is the sole trigger. It runs
  #     `docker start hafele-reporter` only after the queue has been empty
  #     and every processor exited for REPORTER_DRAIN_CONFIRM consecutive
  #     ticks. Without depends_on the container comes up in `created` state
  #     when `docker compose up` runs and stays there until the watchdog
  #     starts it — which is exactly what we want. ─────────────────────
  reporter:
    build:
      context: .
      dockerfile: Dockerfile.reporter
    container_name: hafele-reporter
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/products.db
      - OUTPUT_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    command: ["python", "-m", "reporter"]

volumes:
  redis-data:
